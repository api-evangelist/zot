        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/{name}/manifests/{reference}
      name: v2-name-manifests-reference
      description: REST surface for v2-name-manifests-reference.
      operations:
      - method: DELETE
        name: delete
        description: Delete image manifest
        call: zot.delete
        with:
          name: rest.name
          reference: rest.reference
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: get
        description: Get image manifest
        call: zot.get
        with:
          name: rest.name
          reference: rest.reference
        outputParameters:
        - type: object
          mapping: $.
      - method: HEAD
        name: head
        description: Check image manifest
        call: zot.head
        with:
          name: rest.name
          reference: rest.reference
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: put
        description: Update image manifest
        call: zot.put
        with:
          name: rest.name
          reference: rest.reference
