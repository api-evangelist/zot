        destructive: false
        idempotent: true
      call: zot.get
      outputParameters:
      - type: object
        mapping: $.
    - name: upload-cosign-public-keys-verifying
      description: Upload cosign public keys for verifying signatures
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: zot.post
      with:
        requestBody: tools.requestBody
