      - method: POST
        name: post
        description: Create an API key for the current user
        call: zot.post
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zot/auth/logout
      name: zot-auth-logout
      description: REST surface for zot-auth-logout.
      operations:
      - method: POST
        name: post
        description: Logout by removing current session
        call: zot.post
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: zot-mcp
    port: 9090
    transport: http
    description: MCP adapter for Open Container Initiative Distribution Specification. One tool per consumed operation, routed
      inline through this capability's consumes block.
