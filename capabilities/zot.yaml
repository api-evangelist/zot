        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zot/auth/apikey
      name: zot-auth-apikey
      description: REST surface for zot-auth-apikey.
      operations:
      - method: DELETE
        name: delete
        description: Revokes one current user API key
        call: zot.delete
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: get
        description: Get list of API keys for the current user
