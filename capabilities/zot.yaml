naftiko: 1.0.0-alpha2
info:
  label: Open Container Initiative Distribution Specification
  description: 'Open Container Initiative Distribution Specification. 25 operations. Lead operation: Check API support. Self-contained
    Naftiko capability covering one Zot business surface.'
  tags:
  - Zot
  - Open Container Initiative Distribution Specification
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ZOT_API_KEY: ZOT_API_KEY
capability:
  consumes:
  - type: http
    namespace: zot
    baseUri: ''
    description: Open Container Initiative Distribution Specification business capability. Self-contained, no shared references.
    resources:
    - name: v2
      path: /v2/
      operations:
      - name: get
        method: GET
        description: Check API support
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-_catalog
      path: /v2/_catalog
      operations:
      - name: get
        method: GET
        description: List image repositories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-_oci-ext-discover
      path: /v2/_oci/ext/discover
      operations:
      - name: get
        method: GET
        description: List Registry level extensions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-_zot-ext-cosign
      path: /v2/_zot/ext/cosign
      operations:
      - name: post
        method: POST
        description: Upload cosign public keys for verifying signatures
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: requestBody
          in: body
          type: string
          description: Public key content
          required: true
    - name: v2-_zot-ext-mgmt
      path: /v2/_zot/ext/mgmt
      operations:
      - name: get
        method: GET
        description: Get current server configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resource
          in: query
          type: string
          description: specify resource
    - name: v2-_zot-ext-notation
      path: /v2/_zot/ext/notation
      operations:
      - name: post
        method: POST
        description: Upload notation certificates for verifying signatures
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: truststoreType
          in: query
          type: string
          description: truststore type
        - name: requestBody
          in: body
          type: string
          description: Certificate content
          required: true
    - name: v2-_zot-ext-userprefs
      path: /v2/_zot/ext/userprefs
      operations:
      - name: put
        method: PUT
        description: Add bookmarks/stars info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: action
          in: query
          type: string
          description: specify action
          required: true
        - name: repo
          in: query
          type: string
          description: repository name
          required: true
    - name: v2-name-blobs-uploads
      path: /v2/{name}/blobs/uploads
      operations:
      - name: post
        method: POST
        description: Create image blob/layer upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
    - name: v2-name-blobs-uploads-session_id
      path: /v2/{name}/blobs/uploads/{session_id}
      operations:
      - name: delete
        method: DELETE
        description: Delete image blob/layer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: session_id
          in: path
          type: string
          description: upload session_id
          required: true
      - name: get
        method: GET
        description: Get image blob/layer upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: session_id
          in: path
          type: string
          description: upload session_id
          required: true
      - name: patch
        method: PATCH
        description: Resume image blob/layer upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: session_id
          in: path
          type: string
          description: upload session_id
          required: true
      - name: put
        method: PUT
        description: Update image blob/layer upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: session_id
          in: path
          type: string
          description: upload session_id
          required: true
        - name: digest
          in: query
          type: string
          description: blob/layer digest
          required: true
    - name: v2-name-blobs-digest
      path: /v2/{name}/blobs/{digest}
      operations:
      - name: delete
        method: DELETE
        description: Delete image blob/layer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: digest
          in: path
          type: string
          description: blob/layer digest
          required: true
      - name: get
        method: GET
        description: Get image blob/layer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: digest
          in: path
          type: string
          description: blob/layer digest
          required: true
      - name: head
        method: HEAD
        description: Check image blob/layer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: digest
          in: path
          type: string
          description: blob/layer digest
          required: true
    - name: v2-name-manifests-reference
      path: /v2/{name}/manifests/{reference}
      operations:
      - name: delete
        method: DELETE
        description: Delete image manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: reference
          in: path
          type: string
          description: image reference or digest
          required: true
      - name: get
        method: GET
        description: Get image manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: reference
          in: path
          type: string
          description: image reference or digest
          required: true
      - name: head
        method: HEAD
        description: Check image manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: reference
          in: path
          type: string
          description: image reference or digest
          required: true
      - name: put
        method: PUT
        description: Update image manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: reference
          in: path
          type: string
          description: image reference or digest
          required: true
        - name: tag
          in: query
          type: array
          description: additional tag(s) for digest pushes
    - name: v2-name-referrers-digest
      path: /v2/{name}/referrers/{digest}
      operations:
      - name: get
        method: GET
        description: Get referrers for a given digest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: digest
          in: path
          type: string
          description: digest
          required: true
        - name: artifactType
          in: query
          type: string
          description: artifact type
    - name: v2-name-tags-list
      path: /v2/{name}/tags/list
      operations:
      - name: get
        method: GET
        description: List image tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: repository name
          required: true
        - name: n
          in: query
          type: integer
          description: limit entries for pagination
          required: true
        - name: last
          in: query
          type: string
          description: last tag value for pagination
          required: true
    - name: zot-auth-apikey
      path: /zot/auth/apikey
      operations:
      - name: delete
        method: DELETE
        description: Revokes one current user API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: string
          description: api token id (UUID)
          required: true
      - name: get
        method: GET
        description: Get list of API keys for the current user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: post
        method: POST
        description: Create an API key for the current user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: body
          type: string
          description: api token id (UUID)
          required: true
    - name: zot-auth-logout
      path: /zot/auth/logout
      operations:
      - name: post
        method: POST
        description: Logout by removing current session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: zot-rest
    port: 8080
    description: REST adapter for Open Container Initiative Distribution Specification. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v2
      name: v2
      description: REST surface for v2.
      operations:
      - method: GET
        name: get
        description: Check API support
        call: zot.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/catalog
      name: v2-catalog
      description: REST surface for v2-_catalog.
      operations:
      - method: GET
        name: get
        description: List image repositories
        call: zot.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/oci/ext/discover
      name: v2-oci-ext-discover
      description: REST surface for v2-_oci-ext-discover.
      operations:
      - method: GET
        name: get
        description: List Registry level extensions
        call: zot.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/zot/ext/cosign
      name: v2-zot-ext-cosign
      description: REST surface for v2-_zot-ext-cosign.
      operations:
      - method: POST
        name: post
        description: Upload cosign public keys for verifying signatures
        call: zot.post
        with:
          requestBody: rest.requestBody
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/zot/ext/mgmt
      name: v2-zot-ext-mgmt
      description: REST surface for v2-_zot-ext-mgmt.
      operations:
      - method: GET
        name: get
        description: Get current server configuration
        call: zot.get
        with:
          resource: rest.resource
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/zot/ext/notation
      name: v2-zot-ext-notation
      description: REST surface for v2-_zot-ext-notation.
      operations:
      - method: POST
        name: post
        description: Upload notation certificates for verifying signatures
        call: zot.post
        with:
          truststoreType: rest.truststoreType
          requestBody: rest.requestBody
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/zot/ext/userprefs
      name: v2-zot-ext-userprefs
      description: REST surface for v2-_zot-ext-userprefs.
      operations:
      - method: PUT
        name: put
        description: Add bookmarks/stars info
        call: zot.put
        with:
          action: rest.action
          repo: rest.repo
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/{name}/blobs/uploads
      name: v2-name-blobs-uploads
      description: REST surface for v2-name-blobs-uploads.
      operations:
      - method: POST
        name: post
        description: Create image blob/layer upload
        call: zot.post
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/{name}/blobs/uploads/{session-id}
      name: v2-name-blobs-uploads-session-id
      description: REST surface for v2-name-blobs-uploads-session_id.
      operations:
      - method: DELETE
        name: delete
        description: Delete image blob/layer
        call: zot.delete
        with:
          name: rest.name
          session_id: rest.session_id
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: get
        description: Get image blob/layer upload
        call: zot.get
        with:
          name: rest.name
          session_id: rest.session_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patch
        description: Resume image blob/layer upload
        call: zot.patch
        with:
          name: rest.name
          session_id: rest.session_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: put
        description: Update image blob/layer upload
        call: zot.put
        with:
          name: rest.name
          session_id: rest.session_id
          digest: rest.digest
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/{name}/blobs/{digest}
      name: v2-name-blobs-digest
      description: REST surface for v2-name-blobs-digest.
      operations:
      - method: DELETE
        name: delete
        description: Delete image blob/layer
        call: zot.delete
        with:
          name: rest.name
          digest: rest.digest
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: get
        description: Get image blob/layer
        call: zot.get
        with:
          name: rest.name
          digest: rest.digest
        outputParameters:
        - type: object
          mapping: $.
      - method: HEAD
        name: head
        description: Check image blob/layer
        call: zot.head
        with:
          name: rest.name
