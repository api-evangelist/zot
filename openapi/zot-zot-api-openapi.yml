openapi: 3.2.0
info:
  contact: {}
  description: APIs for Open Container Initiative Distribution Specification
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Open Container Initiative Distribution Specification Zot API
  version: v1.1.1
tags:
- name: Zot
paths:
  /v2/_zot/ext/cosign:
    post:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: string
        '413':
          description: request entity too large
          content:
            application/json:
              schema:
                type: string
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string
      summary: Upload cosign public keys for verifying signatures
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
        description: Public key content
        required: true
      tags:
      - Zot
      operationId: postV2ZotExtCosign
      x-operation-id-source: derived
  /v2/_zot/ext/mgmt:
    get:
      parameters:
      - description: specify resource
        in: query
        name: resource
        schema:
          type: string
          enum:
          - config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/extensions.StrippedConfig'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string
      summary: Get current server configuration
      tags:
      - Zot
      operationId: getV2ZotExtMgmt
      x-operation-id-source: derived
  /v2/_zot/ext/notation:
    post:
      parameters:
      - description: truststore type
        in: query
        name: truststoreType
        schema:
          type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: string
        '413':
          description: request entity too large
          content:
            application/json:
              schema:
                type: string
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string
      summary: Upload notation certificates for verifying signatures
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
        description: Certificate content
        required: true
      tags:
      - Zot
      operationId: postV2ZotExtNotation
      x-operation-id-source: derived
  /v2/_zot/ext/userprefs:
    put:
      parameters:
      - description: specify action
        in: query
        name: action
        required: true
        schema:
          type: string
          enum:
          - toggleBookmark
          - toggleStar
      - description: repository name
        in: query
        name: repo
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
        '400':
          description: bad request".
          content:
            application/json:
              schema:
                type: string
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                type: string
        '404':
          description: not found
          content:
            application/json:
              schema:
                type: string
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string
      summary: Add bookmarks/stars info
      tags:
      - Zot
      operationId: putV2ZotExtUserprefs
      x-operation-id-source: derived
  /zot/auth/apikey:
    delete:
      description: Revokes one current user API key based on given key ID
      parameters:
      - description: api token id (UUID)
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: string
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string
      summary: Revokes one current user API key
      tags:
      - Zot
      operationId: deleteZotAuthApikey
      x-operation-id-source: derived
    get:
      description: Get list of all API keys for a logged in user
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: string
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string
      summary: Get list of API keys for the current user
      tags:
      - Zot
      operationId: getZotAuthApikey
      x-operation-id-source: derived
    post:
      description: Can create an api key for a logged in user, based on the provided label and scopes.
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: string
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: string
        '413':
          description: request entity too large
          content:
            application/json:
              schema:
                type: string
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string
      summary: Create an API key for the current user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.APIKeyPayload'
        description: api token id (UUID)
        required: true
      tags:
      - Zot
      operationId: postZotAuthApikey
      x-operation-id-source: derived
  /zot/auth/logout:
    post:
      description: 'Logout by removing current session. For OIDC providers that advertise an

        `end_session_endpoint` in their discovery metadata (OpenID Connect

        RP-Initiated Logout 1.0), the response body contains an `endSessionUrl`

        the client should navigate to in order to terminate the session at the IdP.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.LogoutResponse'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string
      summary: Logout by removing current session
      tags:
      - Zot
      operationId: postZotAuthLogout
      x-operation-id-source: derived
components:
  schemas:
    extensions.HTPasswd:
      properties:
        path:
          type: string
      type: object
    extensions.OpenIDProviderConfig:
      properties:
        name:
          type: string
      type: object
    api.LogoutResponse:
      properties:
        endSessionUrl:
          type: string
      type: object
    api.APIKeyPayload:
      properties:
        expirationDate:
          type: string
        label:
          type: string
        scopes:
          items:
            type: string
          type: array
      type: object
    extensions.Auth:
      properties:
        apikey:
          type: boolean
        bearer:
          $ref: '#/components/schemas/extensions.BearerConfig'
        htpasswd:
          $ref: '#/components/schemas/extensions.HTPasswd'
        ldap:
          properties:
            address:
              type: string
          type: object
        openid:
          $ref: '#/components/schemas/extensions.OpenIDConfig'
      type: object
    extensions.OpenIDConfig:
      properties:
        providers:
          additionalProperties:
            $ref: '#/components/schemas/extensions.OpenIDProviderConfig'
          type: object
      type: object
    extensions.BearerConfig:
      properties:
        realm:
          type: string
        service:
          type: string
      type: object
    extensions.StrippedConfig:
      properties:
        binaryType:
          type: string
        commit:
          type: string
        distSpecVersion:
          type: string
        http:
          properties:
            auth:
              $ref: '#/components/schemas/extensions.Auth'
          type: object
        releaseTag:
          type: string
      type: object
