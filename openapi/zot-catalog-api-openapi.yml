swagger: '2.0'
info:
  contact: {}
  description: APIs for Open Container Initiative Distribution Specification
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Open Container Initiative Distribution Specification Blobs Catalog API
  version: v1.1.1
tags:
- name: Catalog
paths:
  /v2/_catalog:
    get:
      consumes:
      - application/json
      description: List all image repositories
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/api.RepositoryList'
        '500':
          description: internal server error
          schema:
            type: string
      summary: List image repositories
      tags:
      - Catalog
definitions:
  api.RepositoryList:
    properties:
      repositories:
        items:
          type: string
        type: array
    type: object
